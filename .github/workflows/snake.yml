name: Update contribution snake

on:
  schedule:
    # Daily at 08:17 China Standard Time (00:17 UTC).
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish generated SVGs to the output branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const branch = "output";
            const files = [
              "github-contribution-grid-snake.svg",
              "github-contribution-grid-snake-dark.svg",
            ];
            const entries = files.map((path) => ({
              path,
              mode: "100644",
              type: "blob",
              content: fs.readFileSync(`dist/${path}`, "utf8"),
            }));

            let parent;
            let baseTree;
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`,
              });
              parent = ref.object.sha;
              const { data: previous } = await github.rest.git.getCommit({
                owner, repo, commit_sha: parent,
              });
              baseTree = previous.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: tree } = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree: entries,
            });
            if (tree.sha === baseTree) {
              core.info("Contribution snake is already up to date.");
              return;
            }

            const { data: commit } = await github.rest.git.createCommit({
              owner, repo,
              message: "chore: update contribution snake [skip ci]",
              tree: tree.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) {
              await github.rest.git.updateRef({
                owner, repo, ref: `heads/${branch}`,
                sha: commit.sha, force: false,
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha,
              });
            }
            core.info(`Published contribution snake: ${commit.sha}`);
